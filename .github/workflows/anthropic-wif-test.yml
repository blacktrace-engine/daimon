name: daimon-revival

on:
  push:
    branches: [main]
    paths:
      - 'wake/**'
      - 'state/authority.json'
      - 'scripts/revive.sh'
      - 'scripts/verify-lineage.sh'
      - 'scripts/verify-authority.sh'
      - '.github/workflows/anthropic-wif-test.yml'

permissions:
  id-token: write
  contents: write

concurrency:
  group: daimon-revival
  cancel-in-progress: false

env:
  FEDERATION_RULE_ID: fdrl_01JomjciyfNRwW4j2BuntX1p
  ORGANIZATION_ID: 8c8499b6-971b-401c-9e51-fc548e5e6a41
  SERVICE_ACCOUNT_ID: svac_013vxcAtvp1Bn56hJfziEjuf
  WORKSPACE_ID: wrkspc_01MpgoxyHuuYtoAc38cnqiCn
  AGENT_ID: agent_011rM3Hc2fgGVpf6amGHSkXz
  ENVIRONMENT_ID: env_01MABNSRu46R7pemtfWq4Ljv

jobs:
  revive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify durable lineage before wake
        shell: bash
        run: bash scripts/verify-lineage.sh

      - name: Verify authority before credentials
        shell: bash
        run: bash scripts/verify-authority.sh

      - name: Mint GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Exchange for Anthropic token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS https://api.anthropic.com/v1/oauth/token \
            -H 'content-type: application/json' \
            --data @- <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "$FEDERATION_RULE_ID",
            "organization_id": "$ORGANIZATION_ID",
            "service_account_id": "$SERVICE_ACCOUNT_ID",
            "workspace_id": "$WORKSPACE_ID"
          }
          JSON
          )
          TOKEN=$(jq -r '.access_token' <<<"$RESPONSE")
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "ANTHROPIC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Revive from durable state
        shell: bash
        run: bash scripts/revive.sh

      - name: Persist verified state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Daimon Revival Controller"
          git config user.email "daimon@users.noreply.github.com"

          git add state/daimon.json
          if [ -d state/history ]; then
            git add state/history
          fi
          if git diff --cached --quiet; then
            echo "No verified state change to persist"
            exit 0
          fi

          LOCAL_GENERATION=$(jq -r '.generation' state/daimon.json)
          EXPECTED_REMOTE_GENERATION=$((LOCAL_GENERATION - 1))
          HISTORY_FILE=$(printf 'state/history/%06d.json' "$LOCAL_GENERATION")

          if [ -f "$HISTORY_FILE" ]; then
            HISTORY_GENERATION=$(jq -r '.generation' "$HISTORY_FILE")
            test "$HISTORY_GENERATION" -eq "$LOCAL_GENERATION"
          fi

          git commit -m "Persist Daimon state after verified revival"

          # Repository writes unrelated to Daimon state are allowed to land while
          # cognition is running. Rebase over them only if durable state itself
          # has not advanced. This is a generation compare-and-swap: stale runs
          # may never overwrite a newer identity state.
          git fetch origin main
          REMOTE_GENERATION=$(git show origin/main:state/daimon.json | jq -r '.generation')
          if [ "$REMOTE_GENERATION" -ne "$EXPECTED_REMOTE_GENERATION" ]; then
            echo "Refusing stale state write: expected remote generation $EXPECTED_REMOTE_GENERATION, found $REMOTE_GENERATION" >&2
            exit 1
          fi

          # A lineage entry is append-only. If the target generation already
          # exists remotely, another controller has claimed it and this run is stale.
          if git cat-file -e "origin/main:$HISTORY_FILE" 2>/dev/null; then
            echo "Refusing duplicate lineage entry for generation $LOCAL_GENERATION" >&2
            exit 1
          fi

          git rebase origin/main
          git push origin HEAD:main
